<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>退出登录 · CrispAI</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    /* 配色、圆角沿用后台（HeroUI）的取值，登录页和后台看起来是同一套界面 */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --page: #fafafa;
      --card: #ffffff;
      --text: #11181c;
      --muted: #71717a;
      --field: #f4f4f5;
      --field-hover: #e4e4e7;
      --border: #e4e4e7;
      /* 主按钮和后台的「创建项目」按钮一致：浅色下深底白字，深色下浅底深字 */
      --primary: #11181c;
      --primary-hover: #2b3338;
      --on-primary: #ffffff;
      --danger: #f31260;
      --danger-bg: #fee7ef;
      --success: #12a150;
      --success-bg: #e8faf0;
      --focus: #006fee;
      --shadow: 0 10px 30px rgba(0, 0, 0, .06), 0 2px 6px rgba(0, 0, 0, .04);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --page: #000000;
        --card: #18181b;
        --text: #ecedee;
        --muted: #a1a1aa;
        --field: #27272a;
        --field-hover: #3f3f46;
        --border: #27272a;
        --primary: #ecedee;
        --primary-hover: #ffffff;
        --on-primary: #11181c;
        --danger: #f54180;
        --danger-bg: #310413;
        --success: #45d483;
        --success-bg: #052814;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: var(--text);
      background: var(--page);
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 32px 28px 28px;
    }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; }
    .brand img { width: 44px; height: 44px; margin-bottom: 14px; }
    h1 { font-size: 22px; line-height: 1.3; font-weight: 600; margin: 0; letter-spacing: -.01em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

    form { display: flex; flex-direction: column; gap: 14px; }
    /* 输入框：标签在框内上方，和后台的输入框一致 */
    .field {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--field);
      border-radius: var(--radius);
      padding: 8px 12px 7px;
      transition: background .15s;
      cursor: text;
    }
    .field:hover { background: var(--field-hover); }
    .field:focus-within { background: var(--field); outline: 2px solid var(--focus); outline-offset: 2px; }
    .field label { font-size: 12px; color: var(--muted); cursor: text; }
    .field input {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      outline: 0;
      padding: 1px 0 0;
      width: 100%;
      min-height: 24px;
    }
    .field input::placeholder { color: var(--muted); opacity: .75; }
    .field.has-toggle { padding-right: 46px; }
    .toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .toggle:hover { color: var(--text); }
    .toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
    .toggle svg { width: 18px; height: 18px; }
    .toggle .off { display: none; }
    .toggle[aria-pressed="true"] .on { display: none; }
    .toggle[aria-pressed="true"] .off { display: block; }

    .submit {
      margin-top: 6px;
      height: 44px;
      border: 0;
      border-radius: var(--radius);
      background: var(--primary);
      color: var(--on-primary);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s, transform .1s, opacity .15s;
    }
    .submit:hover { background: var(--primary-hover); }
    .submit:active { transform: scale(.98); }
    .submit:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .submit:disabled { opacity: .6; cursor: default; transform: none; }
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid color-mix(in srgb, var(--on-primary) 40%, transparent);
      border-top-color: var(--on-primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .submit.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
      .submit, .field { transition: none; }
    }

    .notice {
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 14px;
      color: var(--danger);
      background: var(--danger-bg);
    }
    .notice.success { color: var(--success); background: var(--success-bg); }
    .notice:empty { display: none; }
    .cancel { display: block; text-align: center; padding: 8px; color: var(--muted); font-size: 14px; text-decoration: none; border-radius: var(--radius); }
    .cancel:hover { color: var(--text); }
    .cancel:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
    footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="brand">
        <img src="/logo-simple.png" alt="" width="44" height="44">
        <h1 data-i18n="title">是否退出登录？</h1>
        <p class="subtitle" data-i18n="subtitle">退出后需要重新输入账号密码</p>
      </div>
      <noscript><div class="notice">退出登录需要启用 JavaScript。 / JavaScript is required to sign out.</div></noscript>
      <form id="form" method="post" action="/logout">
        <div class="notice" id="notice" role="alert" aria-live="assertive"></div>
        <button class="submit" id="submit" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span data-i18n="confirm">确认</span>
        </button>
        <a class="cancel" id="cancel" href="/" data-i18n="cancel">取消</a>
      </form>
    </section>
    <footer>CrispAI</footer>
  </main>
  <script>
    (function () {
      // 文案沿用后台原有的多语言文本
      var messages = {
        zh: { pageTitle: "退出登录 · CrispAI", title: "是否退出登录？", subtitle: "退出后需要重新输入账号密码",
              confirm: "确认", cancel: "取消", success: "退出成功，正在跳转登录页...", network: "网络异常，请稍后再试" },
        en: { pageTitle: "Sign Out · CrispAI", title: "Sign out?", subtitle: "You will need to sign in again",
              confirm: "Confirm", cancel: "Cancel", success: "Signed out, redirecting...", network: "Network error, please try again" },
        ja: { pageTitle: "サインアウト · CrispAI", title: "サインアウトしますか？", subtitle: "再度サインインが必要になります",
              confirm: "確認", cancel: "キャンセル", success: "サインアウトしました。リダイレクト中...", network: "ネットワークエラー。しばらくしてからもう一度お試しください" }
      };
      var language = (navigator.language || "zh").toLowerCase();
      var locale = language.indexOf("ja") === 0 ? "ja" : language.indexOf("en") === 0 ? "en" : "zh";
      var t = messages[locale];
      document.documentElement.lang = locale === "zh" ? "zh-CN" : locale;
      document.title = t.pageTitle;
      document.querySelectorAll("[data-i18n]").forEach(function (node) {
        node.textContent = t[node.getAttribute("data-i18n")];
      });
      var submit = document.getElementById("submit");
      var notice = document.getElementById("notice");
      document.getElementById("form").addEventListener("submit", function (event) {
        event.preventDefault();
        if (submit.disabled) return;
        submit.disabled = true;
        submit.classList.add("loading");
        fetch("/api/v1/logout", { method: "POST", credentials: "same-origin" }).then(function (response) {
          if (!response.ok) throw new Error(String(response.status));
          notice.className = "notice success";
          notice.textContent = t.success;
          location.replace("/login");
        }).catch(function () {
          submit.disabled = false;
          submit.classList.remove("loading");
          notice.className = "notice";
          notice.textContent = t.network;
        });
      });
    })();
  </script>
</body>
</html>
