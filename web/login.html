<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>登录 · CrispAI</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    /* 配色、圆角沿用后台（HeroUI）的取值，登录页和后台看起来是同一套界面 */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --page: #fafafa;
      --card: #ffffff;
      --text: #11181c;
      --muted: #71717a;
      --field: #f4f4f5;
      --field-hover: #e4e4e7;
      --border: #e4e4e7;
      /* 主按钮和后台的「创建项目」按钮一致：浅色下深底白字，深色下浅底深字 */
      --primary: #11181c;
      --primary-hover: #2b3338;
      --on-primary: #ffffff;
      --danger: #f31260;
      --danger-bg: #fee7ef;
      --success: #12a150;
      --success-bg: #e8faf0;
      --focus: #006fee;
      --shadow: 0 10px 30px rgba(0, 0, 0, .06), 0 2px 6px rgba(0, 0, 0, .04);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --page: #000000;
        --card: #18181b;
        --text: #ecedee;
        --muted: #a1a1aa;
        --field: #27272a;
        --field-hover: #3f3f46;
        --border: #27272a;
        --primary: #ecedee;
        --primary-hover: #ffffff;
        --on-primary: #11181c;
        --danger: #f54180;
        --danger-bg: #310413;
        --success: #45d483;
        --success-bg: #052814;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: var(--text);
      background: var(--page);
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 32px 28px 28px;
    }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; }
    .brand img { width: 44px; height: 44px; margin-bottom: 14px; }
    h1 { font-size: 22px; line-height: 1.3; font-weight: 600; margin: 0; letter-spacing: -.01em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

    form { display: flex; flex-direction: column; gap: 14px; }
    /* 输入框：标签在框内上方，和后台的输入框一致 */
    .field {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--field);
      border-radius: var(--radius);
      padding: 8px 12px 7px;
      transition: background .15s;
      cursor: text;
    }
    .field:hover { background: var(--field-hover); }
    .field:focus-within { background: var(--field); outline: 2px solid var(--focus); outline-offset: 2px; }
    .field label { font-size: 12px; color: var(--muted); cursor: text; }
    .field input {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      outline: 0;
      padding: 1px 0 0;
      width: 100%;
      min-height: 24px;
    }
    .field input::placeholder { color: var(--muted); opacity: .75; }
    .field.has-toggle { padding-right: 46px; }
    .toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .toggle:hover { color: var(--text); }
    .toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
    .toggle svg { width: 18px; height: 18px; }
    .toggle .off { display: none; }
    .toggle[aria-pressed="true"] .on { display: none; }
    .toggle[aria-pressed="true"] .off { display: block; }

    .submit {
      margin-top: 6px;
      height: 44px;
      border: 0;
      border-radius: var(--radius);
      background: var(--primary);
      color: var(--on-primary);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s, transform .1s, opacity .15s;
    }
    .submit:hover { background: var(--primary-hover); }
    .submit:active { transform: scale(.98); }
    .submit:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .submit:disabled { opacity: .6; cursor: default; transform: none; }
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid color-mix(in srgb, var(--on-primary) 40%, transparent);
      border-top-color: var(--on-primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .submit.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
      .submit, .field { transition: none; }
    }

    .notice {
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 14px;
      color: var(--danger);
      background: var(--danger-bg);
    }
    .notice.success { color: var(--success); background: var(--success-bg); }
    .notice:empty { display: none; }
    footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="brand">
        <img src="/logo-simple.png" alt="" width="44" height="44">
        <h1 data-i18n="title">欢迎回来</h1>
        <p class="subtitle" data-i18n="subtitle">登录你的账号来管理项目</p>
      </div>
      <noscript><div class="notice">登录需要启用 JavaScript。 / JavaScript is required to sign in.</div></noscript>
      <!-- method=post：脚本没加载时（被禁用或被拦截），原生提交也不会把密码放进地址栏和访问日志 -->
      <form id="form" method="post" action="/login" novalidate>
        <div class="field">
          <label for="username" data-i18n="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none"
                 autocorrect="off" spellcheck="false" maxlength="200" required autofocus
                 data-i18n-placeholder="usernamePlaceholder" placeholder="请输入用户名">
        </div>
        <div class="field has-toggle">
          <label for="password" data-i18n="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 maxlength="500" required data-i18n-placeholder="passwordPlaceholder" placeholder="请输入密码">
          <button class="toggle" id="toggle" type="button" aria-pressed="false"
                  data-i18n-label="showPassword" aria-label="显示密码">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.5 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
        <div class="notice" id="notice" role="alert" aria-live="assertive"></div>
        <button class="submit" id="submit" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span data-i18n="submit">登录</span>
        </button>
      </form>
    </section>
    <footer>CrispAI</footer>
  </main>

  <script>
    (function () {
      // 文案沿用后台原有的多语言文本，只把「邮箱」换成了自部署版使用的「用户名」
      var messages = {
        zh: {
          pageTitle: "登录 · CrispAI",
          title: "欢迎回来",
          subtitle: "登录你的账号来管理项目",
          username: "用户名",
          usernamePlaceholder: "请输入用户名",
          password: "密码",
          passwordPlaceholder: "请输入密码",
          submit: "登录",
          showPassword: "显示密码",
          hidePassword: "隐藏密码",
          required: "请输入用户名和密码",
          success: "登录成功，即将跳转主页...",
          invalid: "登录凭证错误，请检查用户名和密码",
          tooMany: "登录失败次数过多，请在 {minutes} 分钟后再试",
          disabled: "管理后台未启用：服务器没有配置 ADMIN_PASSWORD",
          network: "网络异常，请稍后再试",
          insecure: "当前是通过 http 访问的，浏览器不会保存登录状态。请改用 https 地址访问"
        },
        en: {
          pageTitle: "Sign In · CrispAI",
          title: "Welcome back",
          subtitle: "Sign in to manage your projects",
          username: "Username",
          usernamePlaceholder: "Enter your username",
          password: "Password",
          passwordPlaceholder: "Enter your password",
          submit: "Sign In",
          showPassword: "Show password",
          hidePassword: "Hide password",
          required: "Enter your username and password",
          success: "Signed in, redirecting...",
          invalid: "Incorrect username or password",
          tooMany: "Too many failed attempts. Try again in {minutes} min",
          disabled: "The admin panel is disabled: ADMIN_PASSWORD is not set on the server",
          network: "Network error, please try again",
          insecure: "This page was opened over http, so the browser will not keep you signed in. Use the https address instead"
        },
        ja: {
          pageTitle: "サインイン · CrispAI",
          title: "お帰りなさい",
          subtitle: "プロジェクトを管理するためにサインインしてください",
          username: "ユーザー名",
          usernamePlaceholder: "ユーザー名を入力してください",
          password: "パスワード",
          passwordPlaceholder: "パスワードを入力してください",
          submit: "サインイン",
          showPassword: "パスワードを表示",
          hidePassword: "パスワードを非表示",
          required: "ユーザー名とパスワードを入力してください",
          success: "サインイン成功、ホームページにリダイレクト中...",
          invalid: "ユーザー名またはパスワードが正しくありません",
          tooMany: "失敗回数が多すぎます。{minutes} 分後にもう一度お試しください",
          disabled: "管理画面は無効です：サーバーに ADMIN_PASSWORD が設定されていません",
          network: "ネットワークエラー。しばらくしてからもう一度お試しください",
          insecure: "http でアクセスしているため、ログイン状態を保存できません。https のアドレスを使用してください"
        }
      };
      var language = (navigator.language || "zh").toLowerCase();
      var locale = language.indexOf("ja") === 0 ? "ja" : language.indexOf("en") === 0 ? "en" : "zh";
      var t = messages[locale];
      document.documentElement.lang = locale === "zh" ? "zh-CN" : locale;
      document.title = t.pageTitle;
      document.querySelectorAll("[data-i18n]").forEach(function (node) {
        node.textContent = t[node.getAttribute("data-i18n")];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(function (node) {
        node.placeholder = t[node.getAttribute("data-i18n-placeholder")];
      });

      var form = document.getElementById("form");
      var username = document.getElementById("username");
      var password = document.getElementById("password");
      var submit = document.getElementById("submit");
      var notice = document.getElementById("notice");
      var toggle = document.getElementById("toggle");
      toggle.setAttribute("aria-label", t.showPassword);

      // 登录后只允许跳回站内路径
      var next = new URLSearchParams(location.search).get("next") || "/";
      if (!/^\/(?![\/\\])[^\s]*$/.test(next) || next.indexOf("/login") === 0) next = "/";

      function show(text, ok) {
        notice.textContent = text || "";
        notice.className = ok ? "notice success" : "notice";
      }
      function busy(on) {
        submit.disabled = on;
        submit.classList.toggle("loading", on);
      }

      toggle.addEventListener("click", function () {
        var visible = password.type === "text";
        password.type = visible ? "password" : "text";
        toggle.setAttribute("aria-pressed", String(!visible));
        toggle.setAttribute("aria-label", visible ? t.showPassword : t.hidePassword);
        password.focus();
      });
      // 点输入框的空白处也能聚焦
      document.querySelectorAll(".field").forEach(function (field) {
        field.addEventListener("mousedown", function (event) {
          if (event.target === field) {
            event.preventDefault();
            field.querySelector("input").focus();
          }
        });
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (submit.disabled) return;
        if (!username.value.trim() || !password.value) {
          show(t.required);
          (username.value.trim() ? password : username).focus();
          return;
        }
        show("");
        busy(true);
        fetch("/api/v1/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username: username.value.trim(), password: password.value })
        }).then(function (response) {
          if (response.ok) {
            return response.json().catch(function () { return {}; }).then(function (data) {
              // 服务器发的是仅限 https 的 Cookie，而当前是 http：浏览器会直接丢弃它，跳转只会绕回登录页
              if (data.secure && location.protocol !== "https:") {
                busy(false);
                show(t.insecure);
                return;
              }
              show(t.success, true);
              location.replace(next);
            });
          }
          busy(false);
          if (response.status === 401) {
            show(t.invalid);
            password.select();
          } else if (response.status === 429) {
            var seconds = Number(response.headers.get("Retry-After")) || 600;
            show(t.tooMany.replace("{minutes}", String(Math.max(1, Math.ceil(seconds / 60)))));
          } else if (response.status === 503) {
            show(t.disabled);
          } else {
            show(t.network);
          }
        }).catch(function () {
          busy(false);
          show(t.network);
        });
      });
    })();
  </script>
</body>
</html>
